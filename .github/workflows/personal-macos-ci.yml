name: ChatAgent Business macOS hosted CI
on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run hosted macOS tests
        run: npm run test:ci
      - name: Document Docker release-host gate
        run: |
          echo "B5/B6 Docker E2E remains in npm test and is required on the release host."
          echo "GitHub macos-latest does not provide the Docker Desktop daemon used by the production exec plane."
