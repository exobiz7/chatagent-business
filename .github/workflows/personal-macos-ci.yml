name: Personal macOS isolated tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run independently installed personal tests (no P8 secrets or services)
        run: npm test
